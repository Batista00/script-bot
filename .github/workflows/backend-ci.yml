name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend with PostgreSQL
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://bot_test:bot_test_password@localhost:5432/bot_whatsapp_test
      TEST_DATABASE_URL: postgresql://bot_test:bot_test_password@localhost:5432/bot_whatsapp_test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bot_whatsapp_test
          POSTGRES_USER: bot_test
          POSTGRES_PASSWORD: bot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot_test -d bot_whatsapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply all migrations
        run: pnpm migrate

      - name: Roll back latest migration
        run: pnpm migrate:down

      - name: Reapply latest migration
        run: pnpm migrate

      - name: Run complete test suite
        run: pnpm test
